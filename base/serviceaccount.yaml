apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyroscope
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pyroscope-discovery
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
      - discovery.k8s.io
    resources:
      - endpoints
      - endpointslices
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pyroscope-discovery
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pyroscope-discovery
subjects:
  - kind: ServiceAccount
    name: pyroscope
    namespace: pyroscope
