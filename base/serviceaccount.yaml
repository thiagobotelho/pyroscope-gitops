apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyroscope
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pyroscope-discovery
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
      - discovery.k8s.io
    # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
    resources:
      - endpoints
      - endpointslices
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pyroscope-discovery
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pyroscope-discovery
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: pyroscope
    namespace: pyroscope
