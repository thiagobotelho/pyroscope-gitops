apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyroscope-ingress
  namespace: pyroscope
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
      app.kubernetes.io/component: all
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pyroscope
      ports:
        - protocol: TCP
          port: 4040
        - protocol: TCP
          port: 7946
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 9099
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 4040
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4040
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-apps
      ports:
        - protocol: TCP
          port: 4040
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zabbix
      ports:
        - protocol: TCP
          port: 4040
    - from:
        - namespaceSelector:
            matchLabels:
              observability: enabled
      ports:
        - protocol: TCP
          port: 4040
