apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: pyroscope
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: pyroscope
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/part-of: observability
    observability: platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
      app.kubernetes.io/component: all
  # Seleciona namespaces; conferir labels antes de ampliar o alcance.
  namespaceSelector:
    matchNames:
      - pyroscope
  endpoints:
    - port: http2
      path: /metrics
      interval: 30s
